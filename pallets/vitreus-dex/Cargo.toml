[package]
name = "pallet-vitreus-dex"
version = "0.1.0"
authors.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
impl-trait-for-tuples = { workspace = true }
log = { workspace = true }
parity-scale-codec = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
frame-benchmarking = { workspace = true, default-features = false, optional = true }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-api = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-arithmetic = { workspace = true, default-features = false }
pallet-asset-conversion = { workspace = true, default-features = false }
# `test-utils` only: the runtime-like world in `testing`, for mocks built on
# top of this pallet.
pallet-balances = { workspace = true, optional = true }
pallet-assets = { workspace = true, optional = true }

[dev-dependencies]
proptest = "=1.5.0"
pallet-balances = { workspace = true, features = ["std"] }
pallet-assets = { workspace = true, features = ["std"] }
pallet-assets-freezer = { workspace = true, features = ["std"] }
primitive-types = { workspace = true, default-features = false, features = ["codec", "scale-info", "num-traits"] }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "log/std",
    "scale-info/std",
    "sp-api/std",
    "sp-core/std",
    "sp-io/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-arithmetic/std",
    "pallet-asset-conversion/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "pallet-asset-conversion/runtime-benchmarks",
]
test-utils = ["std", "dep:pallet-balances", "dep:pallet-assets", "pallet-balances/std", "pallet-assets/std"]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
    "pallet-asset-conversion/try-runtime",
]
